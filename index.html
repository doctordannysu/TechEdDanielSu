
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    nav {
      background: #0f172a;
      padding: 20px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 15px;
      text-decoration: none;
    }

    header {
      padding: 100px 20px;
      text-align: center;
      background: #e2e8f0;
    }

    h1 {
      font-size: 48px;
    }

    section {
      max-width: 900px;
      margin: auto;
      padding: 60px 20px;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #0f172a;
      color: white;
    }
  </style>
</head>
<body>

  <nav>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>

  <header>
    <h1>My Personal Website</h1>
    <p>Welcome to my website!</p>
  </header>

  <section id="about">
    <h2>About Me</h2>
    <p>Write something about yourself here.</p>
  </section>

  <section id="projects">
    <h2>My Projects</h2>
    <p>Showcase your projects here.</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Add your contact information here.</p>
  </section>

  <footer>
    <p>My Personal Website</p>
  </footer>

</body>
</html>
